name: Debug OIDC

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  print-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC subject and claims
        run: |
          set -euo pipefail
          jwt=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          payload=$(echo "$jwt" | cut -d. -f2)
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==";;
            3) payload="${payload}=";;
          esac
          echo "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{sub, aud, repository, repository_owner, ref}'