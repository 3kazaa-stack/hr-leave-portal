[project]
name = "hr-leave-portal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aws-cdk-lib>=2.273.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
]

[project.scripts]
hr-leave-portal = "hr_leave_portal:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aws-cdk-cli>=2.1148.1",
    "aws-lambda-powertools[tracer]>=3.39.0",
    "boto3[crt]>=1.43.121",
    "fastapi>=0.162.0",
    "moto>=5.2.5",
    "pip-audit>=2.10.1",
    "pytest==8.4.2",
    "uvicorn>=0.54.0",
]
